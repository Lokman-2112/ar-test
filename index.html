<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      /* Kamera açılana kadar ekranın siyah kalmasını engeller */
      .a-canvas { width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <!-- uiScanning: true sayesinde ekranın ortasında bir tarama çizgisi çıkar, çalıştığını anlarsın -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: true; autoStart: true;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Resim dosyanın adının spiral.png olduğundan emin ol -->
        <img id="spiral" src="spiral.png" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Bu kısım sadece hedefi (ayçiçeğini) görünce tetiklenir -->
      
        <a-plane 
          src="#spiral" 
          position="0 0 0" 
          height="1" 
          width="1.618" 
          transparent="true" 
          opacity="1">
        </a-plane>
        <a-text 
          value="Fibonacci Spirali" 
          color="red" 
          align="center"
          position="0 -0.8 0" 
          width="3">
        </a-text>
      
    </a-scene>
  </body>
</html>
