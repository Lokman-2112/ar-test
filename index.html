<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Eksik olan kütüphane linkini tam olarak buraya ekledim -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white; display: flex;
            justify-content: center; align-items: center; z-index: 999;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Papatya Takibi Hazırlanıyor...</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        
            <!-- Papatyayı görünce dönecek olan spiral resmin -->
            <a-image src="./spiral.png" position="0 0 0" height="1" width="1"
                     animation="property: rotation; to: 0 0 360; loop: true; dur: 3000; easing: linear">
            </a-image>
        
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        // Kamera hazır olduğunda yükleniyor ekranını kaldırır
        sceneEl.addEventListener("arReady", () => {
            document.getElementById('loading').style.display = 'none';
        });
        // Hata durumunda bilgi verir
        sceneEl.addEventListener("arError", () => {
            document.getElementById('loading').innerText = "Kamera Başlatılamadı!";
        });
    </script>
</body>
</html>
