<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <!-- En güncel ve uyumlu kütüphane sürümleri -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- uiScanning: false yaparak o baştaki tarama animasyonunu kapattık, direkt kamera açılır -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Resim dosyanın adının tam olarak spiral.png olduğundan emin ol -->
        <img id="spiral" src="spiral.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Hedef resmi (Ayçiçeği) görünce spiral belirecek -->
      
        <a-plane 
          src="#spiral" 
          position="0 0 0" 
          height="1" 
          width="1.618" 
          transparent="true" 
          opacity="1">
        </a-plane>
        <a-text 
          value="Fibonacci Spirali" 
          color="red" 
          align="center"
          position="0 -0.8 0" 
          width="3">
        </a-text>
      
    </a-scene>
  </body>
</html>
