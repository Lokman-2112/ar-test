<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <!-- Gerekli AR Kütüphaneleri -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>
    <!-- targets.mind dosyasını okuyan ana sahne -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Kullanacağın resim: spiral.png -->
        <img id="spiral" src="spiral.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targets.mind içindeki hedef resim görüldüğünde çalışacak kısım -->
      
        <!-- Resmin ekranda duruşu -->
        <a-plane 
          src="#spiral" 
          position="0 0 0" 
          height="1" 
          width="1.618" 
          transparent="true" 
          opacity="1">
        </a-plane>
        <!-- Altındaki yazı -->
        <a-text 
          value="Fibonacci Spirali" 
          color="red" 
          position="0 -0.7 0" 
          align="center" 
          width="4">
        </a-text>
      
    </a-scene>
  </body>
</html>
